<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAMEZONE — Игровой портал</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080b14;
    color: white;
}

header {
    padding: 18px 5%;
    display: flex;
    align-items: center;
    gap: 20px;
    justify-content: space-between;
    background: #0d1120;
    position: sticky;
    top: 0;
    z-index: 5;
    border-bottom: 1px solid #242b42;
}

.logo {
    font-size: 28px;
    font-weight: 900;
    color: #8b6cff;
}

.search {
    background: #171d30;
    color: white;
    border: 1px solid #303852;
    border-radius: 12px;
    padding: 12px 16px;
    width: 260px;
    outline: 0;
}

.hero {
    text-align: center;
    padding: 65px 20px 40px;
    background: radial-gradient(
        circle at top,
        #332078,
        #080b14 60%
    );
}

.hero h1 {
    font-size: clamp(42px, 8vw, 80px);
    margin: 0;
    font-weight: 900;
}

.hero h1 span {
    color: #8b6cff;
}

.hero p {
    color: #aeb5c9;
    font-size: 18px;
}

.filters {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 25px;
}

.filters button,
.play,
.close,
.big {
    border: 0;
    border-radius: 12px;
    padding: 11px 17px;
    background: #171d30;
    color: white;
    cursor: pointer;
}

.filters button:hover,
.play,
.big {
    background: #795cff;
}

main {
    padding: 25px 5% 70px;
}

.games {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
}

.card {
    background: #111727;
    border: 1px solid #28304a;
    border-radius: 20px;
    padding: 18px;
    transition: .2s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #795cff;
}

.icon {
    height: 145px;
    border-radius: 15px;
    background: #19134a;
    display: grid;
    place-items: center;
    font-size: 70px;
}

.card h2 {
    margin: 15px 0 7px;
}

.card p {
    color: #929bb1;
    min-height: 35px;
}

.play {
    width: 100%;
    margin-top: 10px;
    font-weight: bold;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.82);
    z-index: 20;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.modal.show {
    display: flex;
}

.box {
    width: min(650px, 100%);
    max-height: 92vh;
    overflow: auto;
    background: #101626;
    border: 1px solid #343d5a;
    border-radius: 22px;
    padding: 25px;
    position: relative;
    text-align: center;
}

.close {
    position: absolute;
    right: 15px;
    top: 15px;
    font-size: 20px;
    padding: 8px 13px;
}

.game {
    margin-top: 30px;
}

.score {
    font-size: 24px;
    margin: 15px;
}

.big {
    font-size: 20px;
    padding: 16px 30px;
    margin: 8px;
}

canvas {
    background: #05070d;
    border-radius: 15px;
    max-width: 100%;
}

/* Кнопки управления на телефоне */

.mobile-controls {
    display: grid;
    grid-template-columns:
        repeat(3, 70px);

    grid-template-rows:
        70px 70px;

    gap: 8px;

    justify-content: center;

    margin: 18px auto 5px;

    touch-action: none;
    user-select: none;
}

.mobile-controls button {
    border: 0;
    border-radius: 16px;

    background: #795cff;
    color: white;

    font-size: 30px;
    font-weight: bold;

    box-shadow: 0 5px 0 #4932a8;

    touch-action: manipulation;
}

.mobile-controls button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #4932a8;
}

.mobile-controls .up {
    grid-column: 2;
}

.mobile-controls .left {
    grid-column: 1;
    grid-row: 2;
}

.mobile-controls .down {
    grid-column: 2;
    grid-row: 2;
}

.mobile-controls .right {
    grid-column: 3;
    grid-row: 2;
}

/* Поле 2048 */

.board2048 {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);

    gap: 7px;

    max-width: 350px;

    margin: auto;

    background: #555;

    padding: 7px;

    border-radius: 10px;
}

.tile {
    aspect-ratio: 1;

    background: #aaa;

    color: #111;

    border-radius: 7px;

    display: grid;

    place-items: center;

    font-size: 25px;

    font-weight: bold;
}

/* Крестики-нолики */

.ttt {
    display: grid;

    grid-template-columns:
        repeat(3, 90px);

    gap: 8px;

    justify-content: center;
}

.cell {
    width: 90px;
    height: 90px;

    border: 0;

    border-radius: 12px;

    background: #1b2235;

    color: white;

    font-size: 42px;

    cursor: pointer;
}

.mode-buttons {
    display: flex;

    gap: 8px;

    justify-content: center;

    flex-wrap: wrap;

    margin: 10px 0;
}

.mode-buttons button {
    border: 0;

    border-radius: 12px;

    padding: 10px 15px;

    background: #171d30;

    color: white;

    cursor: pointer;
}

footer {
    text-align: center;

    color: #6f7890;

    padding: 30px;

    border-top: 1px solid #20263a;
}

@media(max-width:600px) {

    header {
        flex-wrap: wrap;
    }

    .search {
        width: 100%;
    }

    .box {
        padding: 18px 10px;
    }

    .board2048 {
        width: min(92vw, 350px);
    }

    .tile {
        font-size: clamp(18px, 7vw, 25px);
    }

    canvas {
        width: min(92vw, 400px);
        height: auto;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        🎮 GAMEZONE
    </div>

    <input
        id="search"
        class="search"
        placeholder="🔎 Поиск игры..."
    >

</header>

<section class="hero">

    <h1>
        ИГРАЙ
        <span>ПРЯМО СЕЙЧАС</span>
    </h1>

    <p>
        Мини-игры, которые запускаются прямо в браузере
    </p>

    <div class="filters">

        <button data-filter="all">
            Все игры
        </button>

        <button data-filter="arcade">
            Аркады
        </button>

        <button data-filter="action">
            Экшен
        </button>

        <button data-filter="logic">
            Логика
        </button>

    </div>

</section>

<main>

    <div
        id="games"
        class="games">
    </div>

</main>

<footer>

    GAMEZONE © 2026 🎮

    <div style="margin-top:12px">

        <button
            class="big"
            onclick="showLeaderboard()">

            🏆 Таблица лидеров

        </button>

    </div>

</footer>


<!-- ОКНО ИГРЫ -->

<div
    id="modal"
    class="modal">

    <div class="box">

        <button
            id="close"
            class="close">

            ×

        </button>

        <h2 id="title"></h2>

        <div
            id="game"
            class="game">
        </div>

    </div>

</div>


<!-- ТАБЛИЦА ЛИДЕРОВ -->

<div
    id="leaderModal"
    class="modal">

    <div class="box">

        <button
            class="close"
            onclick="closeLeaderboard()">

            ×

        </button>

        <h2>
            🏆 Таблица лидеров
        </h2>

        <div id="leaderboard">
            Загрузка...
        </div>

    </div>

</div>


<script>

const games = [

    {
        id: "clicker",
        name: "Кликер",
        icon: "👆",
        desc: "Кликай и набирай очки!",
        cat: "arcade"
    },

    {
        id: "snake",
        name: "Змейка",
        icon: "🐍",
        desc: "Собирай яблоки и расти!",
        cat: "arcade"
    },

    {
        id: "target",
        name: "Тир",
        icon: "🎯",
        desc: "Попадай по движущейся цели!",
        cat: "action"
    },

    {
        id: "reaction",
        name: "Реакция",
        icon: "⚡",
        desc: "Проверь скорость реакции.",
        cat: "action"
    },

    {
        id: "2048",
        name: "2048",
        icon: "🔢",
        desc: "Собери число 2048.",
        cat: "logic"
    },

    {
        id: "ttt",
        name: "Крестики-нолики",
        icon: "❌",
        desc: "Играй против компьютера.",
        cat: "logic"
    },

    {
        id: "dodge",
        name: "Уклонение",
        icon: "🚀",
        desc: "Уворачивайся от падающих блоков.",
        cat: "action"
    },

    {
        id: "memory",
        name: "Память",
        icon: "🧠",
        desc: "Найди одинаковые пары.",
        cat: "logic"
    }

];


const list =
    document.getElementById("games");

const modal =
    document.getElementById("modal");

const gameBox =
    document.getElementById("game");

const title =
    document.getElementById("title");


function render(arr) {

    list.innerHTML = "";

    arr.forEach(g => {

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <div class="icon">
                ${g.icon}
            </div>

            <h2>
                ${g.name}
            </h2>

            <p>
                ${g.desc}
            </p>

            <button class="play">
                ▶ ИГРАТЬ
            </button>

        `;

        card
            .querySelector(".play")
            .addEventListener(
                "click",
                () => openGame(g.id)
            );

        list.appendChild(card);

    });

}


render(games);


document
    .getElementById("search")
    .addEventListener("input", e => {

        const q =
            e.target.value.toLowerCase();

        render(
            games.filter(g =>
                g.name
                    .toLowerCase()
                    .includes(q)
            )
        );

    });


document
    .querySelectorAll("[data-filter]")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const filter =
                    button.dataset.filter;

                render(
                    filter === "all"
                        ? games
                        : games.filter(
                            g => g.cat === filter
                        )
                );

            }
        );

    });


function openGame(id) {

    modal.classList.add("show");

    const game =
        games.find(x => x.id === id);

    title.textContent =
        game.name;

    gameBox.innerHTML = "";

    if (id === "clicker")
        clicker();

    if (id === "snake")
        snake();

    if (id === "target")
        target();

    if (id === "reaction")
        reaction();

    if (id === "2048")
        game2048();

    if (id === "ttt")
        ttt();

    if (id === "dodge")
        dodge();

    if (id === "memory")
        memory();

}


function closeGame() {

    modal.classList.remove("show");

    gameBox.innerHTML = "";

}


document
    .getElementById("close")
    .addEventListener(
        "click",
        closeGame
    );


modal.addEventListener(
    "click",
    e => {

        if (e.target === modal)
            closeGame();

    }
);


/* =========================
   ЗМЕЙКА
========================= */

function snake() {

    gameBox.innerHTML = `

        <div class="score">
            Очки:
            <b id="ss">0</b>
        </div>

        <canvas
            id="sc"
            width="400"
            height="400">
        </canvas>

        <p>
            Управление кнопками или стрелками
        </p>

        <div
            class="mobile-controls"
            id="snakeControls">

            <button
                class="up"
                data-dir="up">
                ⬆️
            </button>

            <button
                class="left"
                data-dir="left">
                ⬅️
            </button>

            <button
                class="down"
                data-dir="down">
                ⬇️
            </button>

            <button
                class="right"
                data-dir="right">
                ➡️
            </button>

        </div>

        <button
            class="big"
            id="snakeRestart">

            🔄 Заново

        </button>

    `;


    const canvas =
        document.getElementById("sc");

    const ctx =
        canvas.getContext("2d");


    let body = [

        {x:200, y:200},

        {x:180, y:200},

        {x:160, y:200}

    ];


    let food = {
        x:100,
        y:100
    };


    let dx = 20;
    let dy = 0;

    let score = 0;

    let running = true;


    function changeDirection(dir) {

        if (
            dir === "up" &&
            dy === 0
        ) {
            dx = 0;
            dy = -20;
        }

        if (
            dir === "down" &&
            dy === 0
        ) {
            dx = 0;
            dy = 20;
        }

        if (
            dir === "left" &&
            dx === 0
        ) {
            dx = -20;
            dy = 0;
        }

        if (
            dir === "right" &&
            dx === 0
        ) {
            dx = 20;
            dy = 0;
        }

    }


    const key = e => {

        const map = {

            ArrowUp: "up",
            ArrowDown: "down",
            ArrowLeft: "left",
            ArrowRight: "right"

        };


        if (map[e.key]) {

            e.preventDefault();

            changeDirection(
                map[e.key]
            );

        }

    };


    document.addEventListener(
        "keydown",
        key
    );


    document
        .querySelectorAll(
            "#snakeControls button"
        )
        .forEach(button => {

            button.addEventListener(
                "pointerdown",
                e => {

                    e.preventDefault();

                    changeDirection(
                        button.dataset.dir
                    );

                }
            );

        });


    document
        .getElementById("snakeRestart")
        .onclick = () =>
            openGame("snake");


    function gameLoop() {

        if (!running)
            return;


        const head = {

            x: body[0].x + dx,

            y: body[0].y + dy

        };


        if (

            head.x < 0 ||
            head.y < 0 ||
            head.x >= 400 ||
            head.y >= 400 ||

            body.some(
                p =>
                    p.x === head.x &&
                    p.y === head.y
            )

        ) {

            running = false;

            document.removeEventListener(
                "keydown",
                key
            );


            saveScore(
                "Змейка",
                score
            );


            setTimeout(
                () =>
                    alert(
                        "Змейка проиграла! Очки: " +
                        score
                    ),
                20
            );

            return;

        }


        body.unshift(head);


        if (
            head.x === food.x &&
            head.y === food.y
        ) {

            score++;

            document
                .getElementById("ss")
                .textContent = score;


            do {

                food = {

                    x:
                        Math.floor(
                            Math.random() * 20
                        ) * 20,

                    y:
                        Math.floor(
                            Math.random() * 20
                        ) * 20

                };

            } while (
                body.some(
                    p =>
                        p.x === food.x &&
                        p.y === food.y
                )
            );

        } else {

            body.pop();

        }


        ctx.fillStyle =
            "#05070d";

        ctx.fillRect(
            0,
            0,
            400,
            400
        );


        ctx.fillStyle =
            "#ff3d81";

        ctx.fillRect(
            food.x,
            food.y,
            20,
            20
        );


        ctx.fillStyle =
            "#795cff";

        body.forEach(p => {

            ctx.fillRect(
                p.x + 1,
                p.y + 1,
                18,
                18
            );

        });

    }


    const interval =
        setInterval(() => {

            if (!running) {

                clearInterval(
                    interval
                );

                return;

            }

            gameLoop();

        }, 120);

}


/* =========================
   2048
========================= */

function game2048() {

    let board =
        Array(16).fill(0);

    let score = 0;


    gameBox.innerHTML = `

        <div class="score">
            Очки:
            <b id="s2048">0</b>
        </div>

        <p>
            Управление кнопками или стрелками
        </p>

        <div
            id="b2048"
            class="board2048">
        </div>

        <div
            class="mobile-controls"
            id="controls2048">

            <button
                class="up"
                data-dir="up">
                ⬆️
            </button>

            <button
                class="left"
                data-dir="left">
                ⬅️
            </button>

            <button
                class="down"
                data-dir="down">
                ⬇️
            </button>

            <button
                class="right"
                data-dir="right">
                ➡️
            </button>

        </div>

        <button
            class="big"
            id="new2048">

            🔄 Заново

        </button>

    `;


    const boardElement =
        document.getElementById(
            "b2048"
        );


    function addTile() {

        const empty =
            board
                .map(
                    (value, index) =>
                        value === 0
                            ? index
                            : null
                )
                .filter(
                    x => x !== null
                );


        if (empty.length) {

            const index =
                empty[
                    Math.floor(
                        Math.random() *
                        empty.length
                    )
                ];


            board[index] =
                Math.random() < 0.9
                    ? 2
                    : 4;

        }

    }


    function draw() {

        boardElement.innerHTML = "";

        board.forEach(value => {

            const tile =
                document.createElement(
                    "div"
                );

            tile.className =
                "tile";

            tile.textContent =
                value || "";

            boardElement.appendChild(
                tile
            );

        });


        document
            .getElementById("s2048")
            .textContent = score;

    }


    function slide(row) {

        row =
            row.filter(Boolean);


        for (
            let i = 0;
            i < row.length - 1;
            i++
        ) {

            if (
                row[i] ===
                row[i + 1]
            ) {

                row[i] *= 2;

                score += row[i];

                row[i + 1] = 0;

            }

        }


        row =
            row.filter(Boolean);


        while (
            row.length < 4
        ) {

            row.push(0);

        }


        return row;

    }


    function move(direction) {

        const old =
            board.join(",");


        if (
            direction === "left" ||
            direction === "right"
        ) {

            for (
                let r = 0;
                r < 4;
                r++
            ) {

                let row =
                    board.slice(
                        r * 4,
                        r * 4 + 4
                    );


                if (
                    direction ===
                    "right"
                ) {

                    row.reverse();

                }


                row =
                    slide(row);


                if (
                    direction ===
                    "right"
                ) {

                    row.reverse();

                }


                board.splice(
                    r * 4,
                    4,
                    ...row
                );

            }

        } else {

            for (
                let col = 0;
                col < 4;
                col++
            ) {

                let row = [

                    board[col],

                    board[col + 4],

                    board[col + 8],

                    board[col + 12]

                ];


                if (
                    direction ===
                    "down"
                ) {

                    row.reverse();

                }


                row =
                    slide(row);


                if (
                    direction ===
                    "down"
                ) {

                    row.reverse();

                }


                row.forEach(
                    (value, i) => {

                        board[
                            col + i * 4
                        ] = value;

                    }
                );

            }

        }


        if (
            old !== board.join(",")
        ) {

            addTile();

            draw();


            if (
                board.includes(2048)
            ) {

                saveScore(
                    "2048",
                    score
                );

            }

        }

    }


    const key = e => {

        const map = {

            ArrowLeft: "left",

            ArrowRight: "right",

            ArrowUp: "up",

            ArrowDown: "down"

        };


        if (map[e.key]) {

            e.preventDefault();

            move(
                map[e.key]
            );

        }

    };


    document.addEventListener(
        "keydown",
        key
    );


    document
        .querySelectorAll(
            "#controls2048 button"
        )
        .forEach(button => {

            button.addEventListener(
                "pointerdown",
                e => {

                    e.preventDefault();

                    move(
                        button.dataset.dir
                    );

                }
            );

        });


    document
        .getElementById("new2048")
        .onclick = () => {

            document.removeEventListener(
                "keydown",
                key
            );

            openGame("2048");

        };


    addTile();

    addTile();

    draw();

}
