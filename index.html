<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMEZONE — Игровой портал</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#080b14;color:#fff}
header{padding:18px 5%;display:flex;align-items:center;gap:20px;justify-content:space-between;background:#0d1120;position:sticky;top:0;z-index:5;border-bottom:1px solid #242b42}
.logo{font-size:28px;font-weight:900;color:#8b6cff}
.search{background:#171d30;color:#fff;border:1px solid #303852;border-radius:12px;padding:12px 16px;width:260px;outline:0}
.hero{text-align:center;padding:65px 20px 40px;background:radial-gradient(circle at top,#332078,#080b14 60%)}
.hero h1{font-size:clamp(42px,8vw,80px);margin:0;font-weight:900}
.hero h1 span{color:#8b6cff}.hero p{color:#aeb5c9;font-size:18px}
.filters{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:25px}
.filters button,.play,.close,.big{border:0;border-radius:12px;padding:11px 17px;background:#171d30;color:white;cursor:pointer}
.filters button:hover,.play,.big{background:#795cff}
main{padding:25px 5% 70px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.card{background:#111727;border:1px solid #28304a;border-radius:20px;padding:18px;transition:.2s}
.card:hover{transform:translateY(-5px);border-color:#795cff}
.icon{height:145px;border-radius:15px;background:#19134a;display:grid;place-items:center;font-size:70px}
.card h2{margin:15px 0 7px}.card p{color:#929bb1;min-height:35px}
.play{width:100%;margin-top:10px;font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:20;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.box{width:min(650px,100%);max-height:92vh;overflow:auto;background:#101626;border:1px solid #343d5a;border-radius:22px;padding:25px;position:relative;text-align:center}
.close{position:absolute;right:15px;top:15px;font-size:20px;padding:8px 13px}
.game{margin-top:30px}.score{font-size:24px;margin:15px}
.big{font-size:20px;padding:16px 30px;margin:8px}
canvas{background:#05070d;border-radius:15px;max-width:100%}
.target-area{height:300px;background:#080c17;border-radius:15px;position:relative;overflow:hidden}
.target{position:absolute;width:55px;height:55px;border-radius:50%;background:#ff3d81;box-shadow:0 0 20px #ff3d81;cursor:pointer}
.board2048{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:350px;margin:auto;background:#555;padding:7px;border-radius:10px}
.tile{aspect-ratio:1;background:#aaa;color:#111;border-radius:7px;display:grid;place-items:center;font-size:25px;font-weight:bold}
.ttt{display:grid;grid-template-columns:repeat(3,90px);gap:8px;justify-content:center}
.cell{width:90px;height:90px;border:0;border-radius:12px;background:#1b2235;color:white;font-size:42px;cursor:pointer}
footer{text-align:center;color:#6f7890;padding:30px;border-top:1px solid #20263a}
@media(max-width:600px){header{flex-wrap:wrap}.search{width:100%}}
</style>
</head>
<body>

<header>
  <div class="logo">🎮 GAMEZONE</div>
  <input id="search" class="search" placeholder="🔎 Поиск игры...">
</header>

<section class="hero">
  <h1>ИГРАЙ <span>ПРЯМО СЕЙЧАС</span></h1>
  <p>Мини-игры, которые запускаются прямо в браузере</p>
  <div class="filters">
    <button data-filter="all">Все игры</button>
    <button data-filter="arcade">Аркады</button>
    <button data-filter="action">Экшен</button>
    <button data-filter="logic">Логика</button>
  </div>
</section>

<main>
  <div id="games" class="games"></div>
</main>

<footer>GAMEZONE © 2026 🎮</footer>

<div id="modal" class="modal">
  <div class="box">
    <button id="close" class="close">×</button>
    <h2 id="title"></h2>
    <div id="game" class="game"></div>
  </div>
</div>

<script>
const games=[
 {id:"clicker",name:"Кликер",icon:"👆",desc:"Кликай и набирай очки!",cat:"arcade"},
 {id:"snake",name:"Змейка",icon:"🐍",desc:"Собирай яблоки и расти!",cat:"arcade"},
 {id:"target",name:"Тир",icon:"🎯",desc:"Попадай по движущейся цели!",cat:"action"},
 {id:"reaction",name:"Реакция",icon:"⚡",desc:"Проверь скорость реакции.",cat:"action"},
 {id:"2048",name:"2048",icon:"🔢",desc:"Собери число 2048.",cat:"logic"},
 {id:"ttt",name:"Крестики-нолики",icon:"❌",desc:"Играй против компьютера.",cat:"logic"}
];

const list=document.getElementById("games");
const modal=document.getElementById("modal");
const gameBox=document.getElementById("game");
const title=document.getElementById("title");

function render(arr){
 list.innerHTML="";
 arr.forEach(g=>{
   const card=document.createElement("div");
   card.className="card";
   card.innerHTML=`
     <div class="icon">${g.icon}</div>
     <h2>${g.name}</h2>
     <p>${g.desc}</p>
     <button class="play">▶ ИГРАТЬ</button>`;
   card.querySelector(".play").addEventListener("click",()=>openGame(g.id));
   list.appendChild(card);
 });
}
render(games);

document.getElementById("search").addEventListener("input",e=>{
 const q=e.target.value.toLowerCase();
 render(games.filter(g=>g.name.toLowerCase().includes(q)));
});

document.querySelectorAll("[data-filter]").forEach(b=>{
 b.addEventListener("click",()=>{
   const f=b.dataset.filter;
   render(f==="all"?games:games.filter(g=>g.cat===f));
 });
});

document.getElementById("close").addEventListener("click",closeGame);
modal.addEventListener("click",e=>{if(e.target===modal)closeGame()});

function openGame(id){
 modal.classList.add("show");
 const g=games.find(x=>x.id===id);
 title.textContent=g.name;
 gameBox.innerHTML="";
 if(id==="clicker") clicker();
 if(id==="snake") snake();
 if(id==="target") target();
 if(id==="reaction") reaction();
 if(id==="2048") game2048();
 if(id==="ttt") ttt();
}

function closeGame(){
 modal.classList.remove("show");
 gameBox.innerHTML="";
}

/* КЛИКЕР */
function clicker(){
 let score=0;
 gameBox.innerHTML=`
   <div class="score">Очки: <b id="cs">0</b></div>
   <button class="big" id="cb">👆 КЛИКАЙ!</button>`;
 document.getElementById("cb").onclick=()=>{
   score++;
   document.getElementById("cs").textContent=score;
 };
}

/* ТИР */
function target(){
 let score=0, left=30, timer=null;
 gameBox.innerHTML=`
   <div class="score">Очки: <b id="ts">0</b> | Время: <b id="time">30</b></div>
   <button class="big" id="startTarget">▶ Начать</button>
   <div class="target-area" id="ta"></div>`;
 const area=document.getElementById("ta");
 function spawn(){
   const t=document.createElement("div");
   t.className="target";
   t.style.left=Math.random()*(area.clientWidth-55)+"px";
   t.style.top=Math.random()*(area.clientHeight-55)+"px";
   t.onclick=()=>{
     score++;
     document.getElementById("ts").textContent=score;
     t.remove();
     spawn();
   };
   area.appendChild(t);
 }
 document.getElementById("startTarget").onclick=()=>{
   score=0;left=30;
   area.innerHTML="";
   spawn();
   clearInterval(timer);
   timer=setInterval(()=>{
     left--;
     document.getElementById("time").textContent=left;
     if(left<=0){
       clearInterval(timer);
       area.innerHTML="<h2 style='padding-top:120px'>Игра окончена! 🎯</h2>";
     }
   },1000);
 };
}

/* РЕАКЦИЯ */
function reaction(){
 gameBox.innerHTML=`
  <div class="score">Лучшее время: <b id="bestReaction">—</b></div>
  <p id="reactionInfo" style="color:#aeb5c9;margin:15px 0">
    Нажми «Старт», затем жди зелёного цвета.
  </p>
  <button id="reactionButton" class="big"
    style="width:100%;height:220px;font-size:28px;background:#795cff">
    ▶ СТАРТ
  </button>
  <br>
  <button id="reactionReset" class="big" style="font-size:15px">
    🔄 Сбросить
  </button>
 `;

 const button=document.getElementById("reactionButton");
 const info=document.getElementById("reactionInfo");
 const bestEl=document.getElementById("bestReaction");
 const reset=document.getElementById("reactionReset");

 let state="idle";
 let timer=null;
 let startTime=0;
 let best=null;

 function clearGameTimer(){
   if(timer!==null){
     clearTimeout(timer);
     timer=null;
   }
 }

 function resetGame(){
   clearGameTimer();
   state="idle";
   button.style.background="#795cff";
   button.textContent="▶ СТАРТ";
   info.textContent="Нажми «Старт», затем жди зелёного цвета.";
   info.style.color="#aeb5c9";
 }

 button.onclick=()=>{
   if(state==="idle"){
     state="waiting";
     button.style.background="#b52b36";
     button.textContent="НЕ ЖМИ!";
     info.textContent="Жди зелёного цвета...";
     info.style.color="#ffb4b4";

     const delay=1500+Math.random()*3500;

     timer=setTimeout(()=>{
       state="ready";
       startTime=performance.now();
       button.style.background="#20a85a";
       button.textContent="ЖМИ!!!";
       info.textContent="СЕЙЧАС!";
       info.style.color="#8cffae";
       timer=null;
     },delay);

   }else if(state==="waiting"){
     clearGameTimer();
     state="idle";
     button.style.background="#795cff";
     button.textContent="СЛИШКОМ РАНО!";
     info.textContent="Ты нажал раньше времени. Попробуй ещё раз.";
     info.style.color="#ff7777";

     setTimeout(()=>{
       if(state==="idle"){
         button.textContent="▶ СТАРТ";
         info.textContent="Нажми «Старт», затем жди зелёного цвета.";
         info.style.color="#aeb5c9";
       }
     },1000);

   }else if(state==="ready"){
     const result=Math.round(performance.now()-startTime);
     state="result";

     if(best===null || result<best){
       best=result;
       bestEl.textContent=result+" мс";
     }

     button.style.background="#795cff";
     button.textContent=result+" мс";
     info.textContent=result<200
       ?"⚡ Молниеносная реакция!"
       :result<350
       ?"🔥 Отличный результат!"
       :"👍 Неплохо! Попробуй ещё раз.";

     info.style.color="#fff";

     setTimeout(()=>{
       if(state==="result"){
         state="idle";
         button.textContent="▶ СТАРТ";
         info.textContent="Нажми «Старт», затем жди зелёного цвета.";
         info.style.color="#aeb5c9";
       }
     },1400);
   }
 };

 reset.onclick=()=>{
   best=null;
   bestEl.textContent="—";
   resetGame();
 };
}

/* ЗМЕЙКА */
function snake(){
 gameBox.innerHTML=`
 <canvas id="sc" width="400" height="400"></canvas>
 <div class="score">Очки: <b id="ss">0</b></div>
 <p>Управление: стрелки</p>`;
 const c=document.getElementById("sc"),ctx=c.getContext("2d");
 let body=[{x:200,y:200},{x:180,y:200},{x:160,y:200}];
 let food={x:100,y:100},dx=20,dy=0,score=0,running=true;
 const key=e=>{
   if(e.key==="ArrowUp"&&dy===0){dx=0;dy=-20}
   if(e.key==="ArrowDown"&&dy===0){dx=0;dy=20}
   if(e.key==="ArrowLeft"&&dx===0){dx=-20;dy=0}
   if(e.key==="ArrowRight"&&dx===0){dx=20;dy=0}
 };
 document.addEventListener("keydown",key);
 function loop(){
   if(!running)return;
   const head={x:body[0].x+dx,y:body[0].y+dy};
   if(head.x<0||head.y<0||head.x>=400||head.y>=400||
      body.some(p=>p.x===head.x&&p.y===head.y)){
     running=false;
     document.removeEventListener("keydown",key);
     setTimeout(()=>alert("Змейка проиграла! Очки: "+score),20);
     return;
   }
   body.unshift(head);
   if(head.x===food.x&&head.y===food.y){
     score++;
     document.getElementById("ss").textContent=score;
     food={x:Math.floor(Math.random()*20)*20,y:Math.floor(Math.random()*20)*20};
   }else body.pop();
   ctx.fillStyle="#05070d";ctx.fillRect(0,0,400,400);
   ctx.fillStyle="#ff3d81";ctx.fillRect(food.x,food.y,20,20);
   ctx.fillStyle="#795cff";body.forEach(p=>ctx.fillRect(p.x+1,p.y+1,18,18));
 }
 const interval=setInterval(()=>{
   if(!running)clearInterval(interval);
   loop();
 },120);
}

/* 2048 */
function game2048(){
 let board=Array(16).fill(0);
 gameBox.innerHTML=`
  <p>Управление: стрелки ← ↑ → ↓</p>
  <div id="b2048" class="board2048"></div>
  <button class="big" id="new2048">🔄 Заново</button>`;
 const el=document.getElementById("b2048");
 function add(){
   const empty=board.map((v,i)=>v===0?i:null).filter(x=>x!==null);
   if(empty.length)board[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<.9?2:4;
 }
 function draw(){
   el.innerHTML="";
   board.forEach(v=>{
     const d=document.createElement("div");d.className="tile";d.textContent=v||"";el.appendChild(d);
   });
 }
 function slide(row){
   row=row.filter(Boolean);
   for(let i=0;i<row.length-1;i++){
     if(row[i]===row[i+1]){row[i]*=2;row[i+1]=0}
   }
   row=row.filter(Boolean);
   while(row.length<4)row.push(0);
   return row;
 }
 function move(dir){
   const old=board.join(",");
   if(dir==="left"||dir==="right"){
     for(let r=0;r<4;r++){
       let row=board.slice(r*4,r*4+4);
       if(dir==="right")row.reverse();
       row=slide(row);
       if(dir==="right")row.reverse();
       board.splice(r*4,4,...row);
     }
   }else{
     for(let col=0;col<4;col++){
       let row=[board[col],board[col+4],board[col+8],board[col+12]];
       if(dir==="down")row.reverse();
       row=slide(row);
       if(dir==="down")row.reverse();
       row.forEach((v,i)=>board[col+i*4]=v);
     }
   }
   if(old!==board.join(",")){add();draw()}
 }
 const key=e=>{
   const map={"ArrowLeft":"left","ArrowRight":"right","ArrowUp":"up","ArrowDown":"down"};
   if(map[e.key]){e.preventDefault();move(map[e.key])}
 };
 document.addEventListener("keydown",key);
 document.getElementById("new2048").onclick=()=>{
   document.removeEventListener("keydown",key);
   openGame("2048");
 };
 add();add();draw();
}

/* КРЕСТИКИ-НОЛИКИ */
function ttt(){
 let board=Array(9).fill("");
 gameBox.innerHTML=`
  <div id="ttt" class="ttt"></div>
  <div class="score" id="status">Твой ход — X</div>
  <button class="big" id="restart">🔄 Заново</button>`;
 const el=document.getElementById("ttt"),status=document.getElementById("status");
 function win(p){
   return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]
   .some(a=>a.every(i=>board[i]===p));
 }
 function draw(){
   el.innerHTML="";
   board.forEach((v,i)=>{
     const b=document.createElement("button");
     b.className="cell";b.textContent=v;
     b.onclick=()=>player(i);
     el.appendChild(b);
   });
 }
 function player(i){
   if(board[i]||win("X")||win("O"))return;
   board[i]="X";draw();
   if(win("X")){status.textContent="Ты победил! 🎉";return}
   if(board.every(Boolean)){status.textContent="Ничья!";return}
   setTimeout(()=>{
     const free=board.map((v,i)=>v?null:i).filter(i=>i!==null);
     if(!free.length)return;
     board[free[Math.floor(Math.random()*free.length)]]="O";
     draw();
     if(win("O"))status.textContent="Компьютер победил 🤖";
     else if(board.every(Boolean))status.textContent="Ничья!";
   },300);
 }
 document.getElementById("restart").onclick=()=>openGame("ttt");
 draw();
}
</script>
</body>
</html>
